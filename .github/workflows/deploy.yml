name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Vercel production
    runs-on: ubuntu-latest
    # Only runs where the token exists, so a fork or a clean clone does not fail
    # a build it could never have deployed.
    if: github.repository == 'UmaisNisar/fpl-autopilot'
    environment:
      name: production
      url: https://fpl-autopilot-seven.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Guard the deploy behind the checks
        run: |
          npm run typecheck
          npm run test:ci

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set — skipping deploy."
            echo "Add it in Settings > Secrets and variables > Actions, or connect"
            echo "the Vercel Git integration and delete this workflow."
            exit 0
          fi
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
