<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="FPL Autopilot">
  <rect width="32" height="32" rx="7" fill="#04050a"/>

  <!-- Only the two markings that survive a 16px favicon: the halfway line and
       the centre circle. Penalty areas were tried and read as noise at that
       size. -->
  <g fill="none" stroke="#00e5a0" stroke-opacity="0.34" stroke-width="1.4" stroke-linecap="round">
    <path d="M3.6 16h24.8"/>
    <circle cx="16" cy="16" r="7.1"/>
  </g>

  <!-- The bolt carries a background-coloured halo so it cuts cleanly through
       the markings rather than muddling with them. -->
  <g>
    <path d="M19.4 3.6 11.2 17.4h4.3l-2.9 11 8.2-13.8h-4.3z"
          fill="#04050a" stroke="#04050a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M19.4 3.6 11.2 17.4h4.3l-2.9 11 8.2-13.8h-4.3z" fill="#00e5a0"/>
  </g>
</svg>
